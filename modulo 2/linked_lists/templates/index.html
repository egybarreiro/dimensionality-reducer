<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">

    <title>Python Playlist</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            margin: 0;
        }

        .container {
            width: 500px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
        }

        h1 {
            text-align: center;
        }

        form {
            text-align: center;
        }

        input {
            padding: 10px;
            font-size: 16px;
            width: 60%;
        }

        button {
            padding: 10px 18px;
            margin: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        .buttons {
            text-align: center;
            margin-top: 20px;
        }

        .now-playing {
            background: #eeeeee;
            padding: 20px;
            margin-top: 25px;
            text-align: center;
            border-radius: 8px;
        }

        .playlist {
            margin-top: 30px;
        }

        .song {
            padding: 10px;
            margin: 5px 0;
            background: #eeeeee;
            border-radius: 5px;
        }
    </style>
</head>


<body>

<div class="container">

    <h1>🎵 Python Playlist</h1>


    <form action="/add" method="POST">

        <input
            type="text"
            name="song"
            placeholder="Enter song name"
            required
        >

        <button type="submit">
            Add Song
        </button>

    </form>


    <div class="buttons">

        <a href="/play">
            <button>
                ▶ Play Next
            </button>
        </a>

        <a href="/clear">
            <button>
                Clear Playlist
            </button>
        </a>

    </div>


    {% if current_song %}

        <div class="now-playing">

            <h2>🎧 Now Playing</h2>

            <h3>{{ current_song }}</h3>

        </div>

    {% endif %}


    <div class="playlist">

        <h2>Up Next</h2>

        {% if songs %}

            {% for song in songs %}

                <div class="song">
                    🎵 {{ song }}
                </div>

            {% endfor %}

        {% else %}

            <p>Playlist is empty.</p>

        {% endif %}

    </div>

</div>

</body>

</html>
