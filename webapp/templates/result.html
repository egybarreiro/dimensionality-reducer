<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>DimRed APP</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
<div class="layout">
    <header class="header">
        <div class="logo">DimRed APP</div>
        <div class="subtitle">Dashboard de reducción de dimensionalidad</div>
    </header>

    <main class="main">
        <section class="card">
            <h2>Configurar experimento</h2>

            <form action="/process" method="post" enctype="multipart/form-data">
                <div class="form-group">
                    <label>Archivo CSV:</label>
                    <input type="file" name="file" required>
                </div>

                <div class="form-group">
                    <label>Método de reducción:</label>
                    <select name="method">
                        <option value="pca">PCA</option>
                        <option value="tsne">t-SNE</option>
                        <option value="umap">UMAP</option>
                        <option value="lda">LDA</option>
                    </select>
                </div>

                <div class="form-group">
                    <label><input type="checkbox" name="normalize"> Normalizar datos</label>
                </div>

                <button type="submit" class="button primary">Ejecutar</button>
            </form>
        </section>
    </main>
</div>
</body>
</html>
