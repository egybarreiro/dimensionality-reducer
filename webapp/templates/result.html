<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Resultados - DimRed APP</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>

<body>
<div class="layout">

    <header class="header">
        <div class="logo">Resultados</div>
        <div class="subtitle">Visualizaciones y estadísticas</div>
    </header>

    <main class="main">

        <section class="card">
            <h2>Gráfico de correlación</h2>
            <img src="data:image/png;base64,{{ corr_plot }}" alt="Correlation Heatmap">
        </section>

        <section class="card">
            <h2>Comparativo de columnas</h2>
            <img src="data:image/png;base64,{{ compare_plot }}" alt="Column Comparison">
        </section>

        <section class="card">
            <h2>Estadísticas</h2>
            <div>{{ stats|safe }}</div>
        </section>

        <section class="card">
            <h2>Tabla (primeras 20 filas)</h2>
            <div>{{ table|safe }}</div>
        </section>

    </main>

</div>
</body>
</html>
