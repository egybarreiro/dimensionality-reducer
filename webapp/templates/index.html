<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>DimRed APP</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>

<body>

    <div class="container">

        <header class="header">
            <img src="/static/dimred-logo.png" alt="DimRed Logo" class="logo">
            <h1>DimRed APP</h1>
            <p class="subtitle">Visualiza PCA, t‑SNE, UMAP y LDA con un solo clic</p>
        </header>

        <section class="form-section">
            <h2>Reducción de Dimensionalidad</h2>

            <form action="/process" method="POST" enctype="multipart/form-data">

                <label for="file">Archivo CSV:</label>
                <input type="file" id="file" name="file" required class="input-file">

                <label for="method">Método de Reducción:</label>
                <select id="method" name="method" class="select-method">
                    <option value="PCA">PCA</option>
                    <option value="TSNE">t-SNE</option>
                    <option value="UMAP">UMAP</option>
                    <option value="LDA">LDA</option>
                </select>

                <div class="checkbox">
                    <input type="checkbox" id="normalize" name="normalize">
                    <label for="normalize">Normalizar datos</label>
                </div>

                <button type="submit" class="btn">Procesar</button>
            </form>
        </section>

    </div>

</body>
</html>
